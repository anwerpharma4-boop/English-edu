:root{--bg:#fff8ec;--ink:#243044;--mute:#6b7689;--card:#fff;--line:#eadfca;--blue:#2b6fd6;--green:#2fa866;--red:#e5484d;--yellow:#ffc531;--orange:#ff8a3d;--pink:#ee6aa7;--purple:#8a63d2;--teal:#17a2a2;--sh:0 4px 0 rgba(36,48,68,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Baloo,Andika,system-ui,sans-serif;font-weight:500;font-size:18px;line-height:1.5;-webkit-user-select:none;user-select:none;overscroll-behavior:none;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.en{font-family:Andika,system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:2px solid var(--line)}
#top h1{flex:1;margin:0;font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:22px;display:grid;place-items:center;flex:none;border:2px solid var(--line)}
.ib:active,.btn:active,.tile:active,.opt:active{transform:translateY(3px);box-shadow:none}
#stars{background:#fff3c9;border:2px solid #f3d36b;border-radius:99px;padding:4px 14px;font-weight:700;flex:none}
#main{max-width:900px;margin:0 auto;padding:16px 14px 40px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--c,var(--blue));color:#fff;border-radius:22px;padding:16px 12px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.18);font-weight:700;font-size:20px;position:relative}
.tile .ic{font-size:46px;line-height:1.1}
.tile small{font-weight:500;font-size:14px;opacity:.95}
.tile:has(.tag){padding-top:34px}.tile .tag{position:absolute;top:7px;inset-inline-start:8px;white-space:nowrap;background:rgba(255,255,255,.28);border-radius:99px;font-size:12px;padding:1px 9px}
.hero{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px 16px;display:flex;gap:12px;align-items:center;margin-bottom:16px;box-shadow:var(--sh)}
.hero .owl{font-size:54px}
.hero b{font-size:21px}
.hero p{margin:0;color:var(--mute);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c,var(--blue));color:#fff;border-radius:16px;padding:10px 18px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.18);min-height:50px}
.btn.w{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:var(--sh)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--sh)}
.center{text-align:center}
h2{font-size:20px;margin:22px 0 10px}
.lgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));direction:ltr}
.lt{aspect-ratio:1;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:var(--sh);font-family:Andika;font-weight:700;font-size:30px;display:grid;place-items:center;position:relative}
.lt.done{background:#e6f7ec;border-color:#9ad8b3}
.lt i{position:absolute;bottom:2px;right:6px;font-size:12px;font-style:normal}
.bigL{font-family:Andika;font-weight:700;font-size:clamp(90px,24vw,150px);line-height:1;direction:ltr;color:var(--blue)}
.bigL span{color:var(--orange)}
.hint{background:#eef5ff;border-radius:16px;padding:10px 14px;margin:12px 0;font-size:17px}
.wc{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 8px;box-shadow:var(--sh);min-width:0;position:relative}
.wc .w{font-family:Andika;font-weight:700;font-size:22px;direction:ltr}
.wc .w u{text-decoration:none;color:var(--red)}
.wc .a{color:var(--mute);font-size:15px;text-align:center;line-height:1.3}
.wc .st{position:absolute;top:4px;inset-inline-end:8px;font-size:14px}
.pic{font-size:var(--s,56px);line-height:1.15;display:inline-grid;place-items:center;min-height:calc(var(--s,56px)*1.2)}
.pic svg{width:calc(var(--s,56px)*1.1);height:calc(var(--s,56px)*1.1)}
.pic .blob{width:calc(var(--s,56px)*1.05);height:calc(var(--s,56px)*1.05);border-radius:46% 54% 52% 48%/55% 45% 55% 45%;border:3px solid rgba(36,48,68,.25)}
.pic .num{font-family:Andika;font-weight:700;font-size:calc(var(--s,56px)*.95);color:var(--purple);line-height:1.1}
.pic .txt{font-size:calc(var(--s,56px)*.42);font-weight:700;color:var(--teal);padding:0 6px;text-align:center;line-height:1.3}
.flash{max-width:520px;margin:0 auto;text-align:center}
.flash .pic{--s:clamp(110px,30vw,170px)}
.flash .w{font-family:Andika;font-weight:700;font-size:clamp(40px,10vw,60px);direction:ltr;line-height:1.2}
.flash .w span{display:inline-block;transition:.15s}
.flash .w span.hi{color:var(--red);transform:scale(1.35)}
.flash .a{font-size:24px;color:var(--mute)}
.bar{height:12px;background:#eee3cf;border-radius:99px;overflow:hidden;margin:0 0 14px;direction:ltr}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.q{text-align:center;margin-bottom:14px}
.q .pic{--s:clamp(90px,24vw,140px)}
.q p{margin:4px 0;font-size:20px;font-weight:700}

 const show=()=>{if(n>=its.length){addStars(good);save();sfx.win();confetti();main.innerHTML=`<div class="card center"><div class="bigstars">⭐⭐⭐</div><h2>أحسنت!</h2><p>كتبت ${its.length} كلمات، منها ${good} بدون أخطاء</p><div class="row"><button class="btn" id="ag">🔁 مرة أخرى</button><button class="btn w" id="bk">رجوع</button></div></div>`;$('#ag').onclick=()=>{stack.pop();go(spell,id)};$('#bk').onclick=back;return}
  const it=its[n],w=it.en;let p=0,clean=1;
  main.innerHTML=`<div class="bar"><i style="width:${n/its.length*100}%"></i></div><div class="q"><button id="pc">${pic(it)}</button><p>${it.ar}</p></div><div class="slots">${[...w].map(()=>'<div class="slot"></div>').join('')}</div><div class="tiles">${shuf([...w].map((ch,j)=>`<button class="tl" data-ch="${ch}">${ch}</button>`)).join('')}</div>`;
  $('#pc').onclick=()=>speak(w);speak(w);
  main.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{if(b.dataset.ch===w[p]){b.classList.add('used');main.querySelectorAll('.slot')[p].textContent=w[p];p++;sfx.tap();
    if(p===w.length){mark(it.k,clean);if(clean)good++;sfx.ok();speak(w).then(()=>setTimeout(()=>{n++;show()},400))}}
   else{clean=0;sfx.no();b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400)}})};
 if(!its.length){main.innerHTML='<p class="center">لا توجد كلمات مناسبة لهذه اللعبة.</p>';return}show()}
/* ---------- الذاكرة ---------- */
function memory(id){const c=CAT[id];title('لعبة الذاكرة');const seen=new Set(),pool=shuf(c.items).filter(it=>!seen.has(it.v)&&seen.add(it.v)).slice(0,6);
 const cards=shuf(pool.flatMap(it=>[{it,t:'p'},{it,t:'w'}]));let open=[],lock=0,left=pool.length;
 main.innerHTML=`<p class="center" style="margin-top:0">اقلب بطاقتين: صورة وكلمتها</p><div class="mem">${cards.map((_,j)=>`<button class="mc" data-j="${j}">?</button>`).join('')}</div>`;
 main.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const cd=cards[b.dataset.j];if(lock||b.classList.contains('up'))return;b.classList.add('up');b.innerHTML=cd.t==='p'?pic(cd.it):esc(cd.it.en);sfx.tap();open.push([b,cd]);
  if(open.length===2){lock=1;const[[b1,c1],[b2,c2]]=open;open=[];
   if(c1.it===c2.it&&c1.t!==c2.t){sfx.ok();speak(c1.it.en);mark(c1.it.k,1);b1.classList.add('gone');b2.classList.add('gone');lock=0;if(--left===0){addStars(3);save();setTimeout(()=>{sfx.win();confetti();popup(`<div class="bigstars">⭐⭐⭐</div><h2>أحسنت!</h2><div class="row"><button class="btn" id="ag">🔁 مرة أخرى</button><button class="btn w" id="bk">رجوع</button></div>`);$('#ag').onclick=()=>{closePop();stack.pop();go(memory,id)};$('#bk').onclick=()=>{closePop();back()}},700)}}
   else setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.textContent='?'});lock=0},900)}})}

function build(gi){const g=SENT[gi],pool=g.items.filter(s=>toks(s.en).length>=2),its=pickN(pool,Math.min(7,pool.length));let n=0,good=0;title('رتّب الجملة');
 const show=()=>{if(n>=its.length){addStars(good);save();sfx.win();confetti();main.innerHTML=`<div class="card center"><div class="bigstars">⭐⭐⭐</div><h2>أحسنت!</h2><p>رتّبت ${its.length} جمل، منها ${good} بدون أخطاء</p><div class="row"><button class="btn" id="ag">🔁 مرة أخرى</button><button class="btn w" id="bk">رجوع</button></div></div>`;$('#ag').onclick=()=>{stack.pop();go(build,gi)};$('#bk').onclick=back;return}
  const it=its[n],ws=toks(it.en);let p=0,clean=1;
  main.innerHTML=`<div class="bar"><i style="width:${n/its.length*100}%"></i></div><div class="q">${REP}<p>${it.ar}</p></div><div class="built" id="bl"></div><div class="tiles">${shuf(ws.map(w=>`<button class="tl wd" data-w="${esc(w)}">${esc(w)}</button>`)).join('')}</div>`;
  $('#rep').onclick=()=>speak(it.en);speak(it.en);
  main.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{if(b.dataset.w===ws[p]){b.classList.add('used');$('#bl').insertAdjacentHTML('beforeend',`<span>${esc(ws[p])}</span>`);p++;sfx.tap();
    if(p===ws.length){mark(it.k,clean);if(clean)good++;sfx.ok();speak(it.en).then(()=>setTimeout(()=>{n++;show()},500))}}
   else{clean=0;sfx.no();b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400)}})};
 show()}

function addStars(n){if(!n)return;const t=today(),b=S.ds[t]||0,os=Math.floor(S.stars/12);S.stars+=n;S.ds[t]=b+n;
 const ns=Math.min(STK.length,Math.floor(S.stars/12));if(ns>Math.min(STK.length,os))setTimeout(()=>{toast('🎉 ملصق جديد: <span style="font-size:30px">'+STK[ns-1]+'</span>');sfx.win()},900);

 btns.forEach(b=>b.onclick=()=>{const j=+b.dataset.j,c=CMDS[j];

function drawSvg(i,cls){const d=DRAW[i],f=(S.col[d[0]]||{}).f||[];let n=0;return`<svg viewBox="0 0 200 200" class="${cls||''}"><g stroke="#243044" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="#fff">${d[2].map(s=>s[0]==='*'?s.slice(1).replace(/^<(\w+)/,(m,t)=>`<${t} class="r" data-i="${n}" fill="${f[n++]||'#fff'}"`):s).join('')}</g></svg>`}
function colourList(){title('التلوين');main.innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn" style="--c:var(--orange)" id="cg">👂 لعبة: اسمع ولوّن</button><button class="btn" style="--c:var(--purple)" id="fd">✏️ ارسم بحرّية</button></div><p class="center" style="margin:0 0 10px;color:var(--mute)">أو اختر رسمة ولوّنها كما تحب (${DRAW.length} رسمة)</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${DRAW.map((d,i)=>`<button class="wc" data-i="${i}">${(S.col[d[0]]||{}).done?'<span class="st">⭐</span>':''}${drawSvg(i,'thumb')}<span class="w">${d[0]}</span><span class="a">${d[1]}</span></button>`).join('')}${U.d.map((d,j)=>`<button class="wc" data-u="${j}"><span class="del" data-del="1">✖</span><img src="${d.img}" class="thumb" style="width:84px;height:84px;object-fit:contain" alt=""><span class="w">${esc(d.en)}</span><span class="a">${esc(d.ar)}</span></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn w" id="addd">➕ أضف رسمة من صورة</button></div><p class="center" style="color:var(--mute);font-size:15px">أفضل نتيجة: صورة رسمة بخطوط سوداء على ورق أبيض، فيلوّن الطفل فوقها بإصبعه.</p>`;
 main.querySelectorAll('.wc[data-i]').forEach(b=>b.onclick=()=>go(colourIt,+b.dataset.i));
 main.querySelectorAll('.wc[data-u]').forEach(b=>b.onclick=e=>{const d=U.d[b.dataset.u];if(e.target.closest('.del'))return delU(U.d,d.id,d.en);go(freeDraw,d.id)});
 $('#addd').onclick=()=>addForm({t:'➕ رسمة جديدة للتلوين',what:'اسم الرسمة',photo:'req',px:720,save:o=>pushU(U.d,{id:o.id,en:o.en,ar:o.ar,img:o.img},30,0)});$('#cg').onclick=()=>go(colourGame,Math.random()*DRAW.length|0);$('#fd').onclick=()=>go(freeDraw,'')}
function colourGame(i){const d=DRAW[i],sv=S.col[d[0]];delete S.col[d[0]];title('اسمع ولوّن');let want=null,cur=null,good=0,first=1,n=0;
 main.innerHTML=`<div class="center"><div class="row" style="margin-bottom:8px">${REP}<b id="ins">اسمع اللون، اختره، ثم اضغط على جزء من الرسمة</b></div><div class="colbox" style="max-width:min(360px,100%)">${drawSvg(i)}</div>
 <div class="pal">${PAL.slice(0,10).map((p,j)=>`<button class="pc" data-j="${j}" style="background:${p[2]}" aria-label="${p[0]}"></button>`).join('')}</div><p style="margin:6px 0"><b class="en" id="cn" style="font-size:26px">?</b></p><div id="res" style="min-height:40px;font-weight:700"></div></div>`;
 if(sv)S.col[d[0]]=sv;const rs=[...main.querySelectorAll('.colbox .r')],pcs=[...main.querySelectorAll('.pc')];
 const next=()=>{if(n>=rs.length){addStars(Math.min(good,6));sfx.win();confetti();$('#res').innerHTML=praise()+` (${good}/${rs.length})<div class="row" style="margin-top:8px"><button class="btn" id="ag">🔁 رسمة أخرى</button></div>`;$('#ag').onclick=()=>{stack.pop();go(colourGame,(i+1+(Math.random()*(DRAW.length-1)|0))%DRAW.length)};return}
  const prev=want;do{want=PAL[Math.random()*10|0]}while(want===prev);cur=null;first=1;pcs.forEach(x=>x.classList.remove('on'));$('#cn').textContent='?';speak('Colour it '+want[0]+'.')};
 $('#rep').onclick=()=>want&&speak('Colour it '+want[0]+'.');
 pcs.forEach(b=>b.onclick=()=>{if(n>=rs.length)return;const p=PAL[b.dataset.j];if(p===want){cur=p;sfx.ok();pcs.forEach(x=>x.classList.toggle('on',x===b));$('#cn').textContent=p[0]}else{first=0;sfx.no();setTimeout(()=>speak(want[0],1),300)}});
 rs.forEach(r=>r.onclick=()=>{if(n>=rs.length||r.dataset.done)return;if(!cur){speak('Colour it '+want[0]+'.');return}r.setAttribute('fill',cur[2]);r.dataset.done=1;sfx.tap();if(first)good++;n++;setTimeout(next,500)});next()}
function freeDraw(bgId){const bg=U.d.find(d=>d.id===bgId);title(bg?'لوّن: '+bg.ar:'ارسم بحرّية');let cur=PAL[4],bw=bg?14:8;const w=Math.min(innerWidth-34,700),hh=Math.max(260,Math.min(innerHeight-330,520)),dpr=Math.min(window.devicePixelRatio||1,2);
 main.innerHTML=`<canvas class="paint" id="pc" width="${w*dpr}" height="${hh*dpr}" style="height:${hh}px;max-width:${w}px;margin:0 auto"></canvas><div class="pal">${PAL.map((p,j)=>`<button class="pc ${j===4?'on':''}" data-j="${j}" style="background:${p[2]}" aria-label="${p[0]}"></button>`).join('')}</div>
 <p class="center" style="margin:6px 0"><b class="en" id="cn" style="font-size:26px">${cur[0]}</b> <span id="ca">${cur[1]}</span></p><div class="row">${bg?'<button class="btn" id="sn">🔊 '+esc(bg.en)+'</button>':''}<button class="btn w" data-b="4">قلم رفيع</button><button class="btn w" data-b="8">قلم وسط</button><button class="btn w" data-b="20">قلم عريض</button><button class="btn w" id="cl">🧽 امسح</button></div>`;
 const c=$('#pc'),x=c.getContext('2d');x.lineCap=x.lineJoin='round';let on=0,px,py;
 const paintBg=()=>{x.globalCompositeOperation='source-over';x.clearRect(0,0,c.width,c.height);if(!bg)return;const im=new Image();im.onload=()=>{const k=Math.min(c.width/im.width,c.height/im.height);x.globalCompositeOperation='source-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,(c.width-im.width*k)/2,(c.height-im.height*k)/2,im.width*k,im.height*k);x.globalCompositeOperation='multiply'};im.src=bg.img};paintBg();if(bg){$('#sn').onclick=()=>sayItem(bg);sayItem(bg)}const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width*c.width,(e.clientY-r.top)/r.height*c.height]};
 c.onpointerdown=e=>{e.preventDefault();on=1;[px,py]=pos(e);x.strokeStyle=cur[2];x.lineWidth=bw*dpr;x.beginPath();x.moveTo(px,py);x.lineTo(px+.01,py);x.stroke();try{c.setPointerCapture(e.pointerId)}catch(_){}};
 c.onpointermove=e=>{if(!on)return;e.preventDefault();const[a,b]=pos(e);x.beginPath();x.moveTo(px,py);x.lineTo(a,b);x.stroke();px=a;py=b};c.onpointerup=c.onpointercancel=()=>on=0;
 main.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{cur=PAL[b.dataset.j];main.querySelectorAll('.pc').forEach(k=>k.classList.toggle('on',k===b));$('#cn').textContent=cur[0];$('#ca').textContent=cur[1];sayItem({en:cur[0],ar:cur[1]})});
 main.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>bw=+b.dataset.b);$('#cl').onclick=paintBg}
function colourIt(i){const d=DRAW[i],it={en:d[0],ar:d[1]},o=S.col[d[0]]||(S.col[d[0]]={f:[]});let cur=PAL[0];title('لوّن: '+d[1]);
 main.innerHTML=`<div class="center"><div class="colbox">${drawSvg(i)}</div><div class="flash"><button class="w" id="nm" style="font-size:38px">🔊 ${d[0]}</button><div class="a">${d[1]}</div></div>
 <div class="pal">${PAL.map((p,j)=>`<button class="pc ${j?'':'on'}" data-j="${j}" style="background:${p[2]}" aria-label="${p[0]}"></button>`).join('')}</div>
 <p style="margin:6px 0"><b class="en" id="cn" style="font-size:26px">${cur[0]}</b> <span id="ca">${cur[1]}</span></p>
 <div class="row"><button class="btn w" id="cl">🧽 امسح الألوان</button><button class="btn w" id="pv">◀ السابق</button><button class="btn w" id="nx">التالي ▶</button></div><div id="res" style="min-height:40px;margin-top:8px;font-weight:700"></div></div>`;
 const rs=[...main.querySelectorAll('.colbox .r')];
 $('#nm').onclick=()=>sayItem(it);sayItem(it);
 main.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{cur=PAL[b.dataset.j];main.querySelectorAll('.pc').forEach(x=>x.classList.toggle('on',x===b));$('#cn').textContent=cur[0];$('#ca').textContent=cur[1];sayItem({en:cur[0],ar:cur[1]})});
 rs.forEach(r=>r.onclick=()=>{r.setAttribute('fill',cur[2]);o.f[r.dataset.i]=cur[2];sfx.tap();save();
  if(rs.every(x=>(x.getAttribute('fill')||'#fff').toLowerCase()!=='#fff')&&!o.shown){o.shown=1;if(!o.done){o.done=1;addStars(3)}sfx.win();confetti();const ph=(/^[aeiou]/.test(d[0])?'an ':'a ')+d[0];$('#res').innerHTML='🌟 <span class="en">Beautiful! It\'s '+ph+'.</span>';speak("Beautiful! It's "+ph+'.')}});
 $('#cl').onclick=()=>{o.f=[];o.shown=0;rs.forEach(r=>r.setAttribute('fill','#fff'));$('#res').innerHTML='';save()};
 $('#pv').onclick=()=>{stack.pop();go(colourIt,(i+DRAW.length-1)%DRAW.length)};$('#nx').onclick=()=>{stack.pop();go(colourIt,(i+1)%DRAW.length)}}

 main.innerHTML=`<div class="hero"><div class="owl">🎖️</div><div><b>${n} / ${STK.length} ملصق</b><p>كل 12 نجمة تفتح ملصقاً جديداً. بقي ${n<STK.length?12-S.stars%12:0} نجمة للملصق القادم. اضغط على الملصق لتسمع اسمه.</p></div></div>

if(S.custom&&S.custom.length){S.custom.forEach(w=>U.w.push({id:'m'+Math.random().toString(36).slice(2,8),c:'mine',en:w.en,ar:w.ar,v:w.v||''}));S.custom=[]}

 SENT.forEach(g=>{g.items=g.items.filter(i=>!i.cu);U.s.filter(x=>x.g===g.id).forEach(x=>g.items.push({en:x.en,ar:x.ar,bk:0,cu:x.id,k:'s:'+x.en}))});
 CMDS.length=NB;U.c.forEach(x=>CMDS.push([x.en,x.ar,x.e||'⭐',x.act||'',x.id]))}
function loadImg(file,px,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,px/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>cb('');im.src=r.result};r.onerror=()=>cb('');r.readAsDataURL(file)}
// نافذة الإضافة: o={t,what,photo:'opt'|'req',emoji,acts,px,save(obj)}
function addForm(o){let img='';popup(`<h2 style="margin-top:0">${o.t}</h2><div style="text-align:start">
 <p style="margin:6px 0">${o.what||'الكلمة'} بالإنجليزية:<br><input id="fe" dir="ltr" class="en" style="width:100%" maxlength="${o.max||30}" autocapitalize="off" autocomplete="off"></p>

 ${o.emoji?'<p style="margin:6px 0">رمز (إيموجي) اختياري:<br><input id="fv" style="width:130px" maxlength="8" placeholder="🙂"></p>':''}
 ${o.acts?`<p style="margin:6px 0">حركة الولد عند هذا الأمر:<br><select id="fx2" style="width:100%"><option value="">بدون حركة (يظهر الرمز فقط)</option>${CMDS.slice(0,NB).map(c=>`<option value="${c[3]}">${c[1]} — ${c[0]}</option>`).join('')}</select></p>`:''}
 ${o.photo?`<div class="row" style="justify-content:flex-start;margin:8px 0"><label class="btn w">📷 ${o.photo==='req'?'اختر صورة أو التقطها':'أضف صورة (اختياري)'}<input type="file" accept="image/*" id="ff" hidden></label><span id="fp"></span></div>`:''}
 <div id="fm" style="color:var(--red);min-height:26px;font-size:16px"></div></div><div class="row"><button class="btn w" id="ft">🔊 جرّب النطق</button><button class="btn" style="--c:var(--green)" id="fs">حفظ</button><button class="btn w" id="fc">إلغاء</button></div>`);

 g('ft').onclick=()=>{const e=g('fe').value.trim();if(e)sayItem({en:e,ar:g('fa').value.trim()})};g('fc').onclick=closePop;
 g('fs').onclick=()=>{const en=g('fe').value.trim().replace(/\s+/g,' '),ar=g('fa').value.trim(),v=g('fv')?g('fv').value.trim():'';
  if(!/^[A-Za-z0-9][A-Za-z0-9 ,.'!?\-]*$/.test(en))return err('اكتب النص بحروف إنجليزية.');if(!ar)return err('اكتب المعنى بالعربية.');if(o.photo==='req'&&!img)return err('اختر صورة أولاً.');

function pushU(list,obj,max,dup){if(dup)return'هذا العنصر مضاف من قبل.';if(list.length>=max)return'وصلت إلى الحد الأقصى ('+max+').';list.push(obj);if(!saveU()){list.pop();return'ذاكرة الجهاز لا تكفي. احذف بعض الصور المضافة ثم حاول.'}syncU()}
function delU(list,id,label){popup(`<h2 style="margin-top:0">حذف «${esc(label)}»؟</h2><div class="row"><button class="btn" style="--c:var(--red)" id="y">نعم، احذف</button><button class="btn w" id="n">لا</button></div>`);
 $('#n').onclick=closePop;$('#y').onclick=()=>{const i=list.findIndex(x=>x.id===id);if(i>=0)list.splice(i,1);saveU();syncU();closePop();draw()}}
